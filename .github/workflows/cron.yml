name: 随机定时运行

on:
  workflow_dispatch:                          # 手动触发（用于测试）
  workflow_run:
    workflows: ["刷步数"]                     # 自动触发：当“刷步数”成功完成时
    types:
      - completed

jobs:
  repo-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    # 使用 PAT 时，可以不加 permissions，但保留也无妨（PAT 权限更高）
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}           # ← 使用你之前设置的 PAT

      - name: random cron
        run: |
          echo "Current cron line:"
          grep "cron:" .github/workflows/run.yml || true

          sed -i -E "s/(- cron: ')[0-9]+/\1$(($RANDOM % 10))/" .github/workflows/run.yml

          if git diff --quiet; then
            echo "No changes, skip commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "random cron."
            git push origin master
          fi
