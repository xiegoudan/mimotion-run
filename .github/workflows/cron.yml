name: 随机定时运行

on:
  workflow_dispatch:          # ✅ 改为手动触发，可点击“Run workflow”按钮执行

jobs:
  repo-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    # 授予对仓库内容的写权限，使 git push 能够生效
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}   # 使用 GitHub 自动生成的令牌（手动触发时具有写权限）

      - name: random cron
        run: |
          # 随机修改 run.yml 中的分钟数（0~9）
          sed -i -E "s/(- cron: ')[0-9]+( [^[:space:]]+ \* \* \*')/\1$(($RANDOM % 10))\2/g" .github/workflows/run.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .
          git commit -m "random cron."
          git push origin master
