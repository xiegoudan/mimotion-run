name: 随机定时运行

on:
  workflow_dispatch:          # 手动触发，点击 “Run workflow” 即可执行

jobs:
  repo-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    # 关键权限：允许修改并推送工作流文件（包括 .github/workflows/*.yml）
    permissions:
      contents: write          # 允许推送代码
      workflows: write         # 允许修改工作流文件本身

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}   # 使用 GitHub 自动生成的令牌

      - name: random cron
        run: |
          # 调试：显示当前 cron 行，方便确认格式
          echo "Current cron line:"
          grep "cron:" .github/workflows/run.yml || echo "No cron line found"

          # 替换分钟数为 0~9 的随机数字（假设格式为 - cron: '数字 ...'）
          sed -i -E "s/(- cron: ')[0-9]+/\1$(($RANDOM % 10))/" .github/workflows/run.yml

          # 检查是否有实际改动，若无则跳过提交
          if git diff --quiet; then
            echo "No changes detected, skipping commit and push."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "random cron."
            git push origin master
          fi
