name: 随机定时运行

on:
  workflow_dispatch:          # 手动触发

jobs:
  repo-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    permissions:
      contents: write
      workflows: write         # 关键：允许修改 .github/workflows/*.yml

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: random cron
        run: |
          echo "Current cron line:"
          grep "cron:" .github/workflows/run.yml || true

          sed -i -E "s/(- cron: ')[0-9]+/\1$(($RANDOM % 10))/" .github/workflows/run.yml

          if git diff --quiet; then
            echo "No changes, skip commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "random cron."
            git push origin master
          fi
